name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: masterqala
          POSTGRES_PASSWORD: masterqala
          POSTGRES_DB: masterqala_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U masterqala -d masterqala_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres_queue:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: masterqala
          POSTGRES_PASSWORD: masterqala
          POSTGRES_DB: masterqala_urgent_queue_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U masterqala -d masterqala_urgent_queue_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://masterqala:masterqala@localhost:5433/masterqala_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY_HOPS: "0"
      PGBOSS_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check isolated test deployment guards
        run: node --test scripts/test-production/guard.test.cjs

      - name: Build and test shared UI
        run: pnpm --filter @masterqala/ui run test

      - name: Test client interactions
        run: pnpm --filter client run test

      - name: Test Vite client recovery
        run: pnpm --filter web run test

      - name: Test master login interactions
        run: pnpm --filter master run test

      - name: Test operator interactions
        run: pnpm --filter operator run test

      - name: Test public site interactions
        run: pnpm --filter site run test

      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Build API
        run: pnpm --filter api build

      - name: Run API unit tests
        run: pnpm --filter api run test --runInBand

      - name: Run API e2e tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter api test:e2e 2>&1 | tee api-e2e.log

      - name: Upload API e2e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-log
          path: api-e2e.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Apply isolated queue-test database migrations
        env:
          DATABASE_URL: postgresql://masterqala:masterqala@localhost:5434/masterqala_urgent_queue_ci
        run: pnpm --filter api exec prisma migrate deploy

      - name: Test real urgent queue expiry and restart
        env:
          DATABASE_URL: postgresql://masterqala:masterqala@localhost:5434/masterqala_urgent_queue_ci
          ALLOW_ISOLATED_QUEUE_TESTS: "1"
          PGBOSS_DISABLED: "0"
          COMMERCIAL_MODE: DIRECT_PAYMENT
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter api run test:queue:e2e 2>&1 | tee api-queue-e2e.log

      - name: Upload isolated queue-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-queue-e2e-log
          path: api-queue-e2e.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build web application
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter web build 2>&1 | tee web-build.log

      - name: Upload web build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-log
          path: web-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build client application
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter client build 2>&1 | tee client-build.log

      - name: Upload client build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-build-log
          path: client-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build master application
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter master build 2>&1 | tee master-build.log

      - name: Upload master build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-build-log
          path: master-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build operator application
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter operator build 2>&1 | tee operator-build.log

      - name: Upload operator build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-build-log
          path: operator-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Start API server for site build
        shell: bash
        run: |
          set -o pipefail
          nohup pnpm --filter api start:prod > api-server.log 2>&1 &
          echo $! > api-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API server did not become ready in time" >&2
          cat api-server.log >&2
          exit 1

      - name: Build site application
        shell: bash
        env:
          API_URL: http://localhost:3000/api/v1
        run: |
          set -o pipefail
          pnpm --filter site build 2>&1 | tee site-build.log

      - name: Stop API server
        if: always()
        shell: bash
        run: |
          if [ -f api-server.pid ]; then
            kill "$(cat api-server.pid)" 2>/dev/null || true
          fi

      - name: Upload site build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build-log
          path: site-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload API server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-log
          path: api-server.log
          if-no-files-found: ignore
          retention-days: 3
